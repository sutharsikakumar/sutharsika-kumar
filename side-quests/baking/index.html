<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Baking — Sutharsika Kumar</title>
  <meta name="description" content="A few cakes, suspended mid-air." />
  <link rel="icon" href="../../assets/favicon.png" />
  <link rel="stylesheet" href="../../styles.css" />
  <script src="../../assets/site.js" defer></script>
</head>
<body>
  <main class="page page--wide">

    <header class="site-header">
      <a class="btn btn--home" href="/">Home</a>
    </header>

    <h1 class="page-title">Baking</h1>
    <p class="page-lede">A few cakes I have baked over the years. I prefer to avoid artificial flavoring and colors so a lot of the colors come from beet-reductions or strawberry reductions. Looking to experiment with different flavors.</p>

    <div class="float-stage">
      <button class="cake cake--a" type="button" style="--drift-dur: 7.5s; --drift-delay: 0s;">
        <img src="images/strawberry.png" alt="Strawberry chocolate-drip cake with fresh strawberries over whipped cream" loading="lazy" />
        <span class="cake__label"><strong>Strawberries &amp; Cream</strong>Chocolate ganache drip with fresh strawberries over whipped cream.</span>
      </button>

      <button class="cake cake--b" type="button" style="--drift-dur: 6s; --drift-delay: -2s;">
        <img src="images/pink-drip.png" alt="Pink buttercream cake with a dark chocolate drip and chocolate shards" loading="lazy" />
        <span class="cake__label"><strong>Pink Drip</strong>Pink buttercream with a dark chocolate drip and chocolate shards.</span>
      </button>

      <button class="cake cake--c" type="button" style="--drift-dur: 8.5s; --drift-delay: -4s;">
        <img src="images/tiramisu.png" alt="Tiramisu cake with whipped-cream rosettes dusted with cocoa" loading="lazy" />
        <span class="cake__label"><strong>Tiramisu</strong>Whipped cream rosettes dusted with cocoa.</span>
      </button>
    </div>

    <footer class="footer-links" data-footer></footer>
  </main>
</body>
</html>
