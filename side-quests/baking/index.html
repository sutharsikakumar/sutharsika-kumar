<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Baking — Sutharsika Kumar</title>
  <link rel="icon" href="../../assets/favicon.png" />
  <link rel="stylesheet" href="../../styles.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet" />
</head>
<body>
  <main class="page">
    <div class="page-tab">
      <a class="pill pill--grey" href="../../index.html">Baking</a>
    </div>
    <div class="photo-grid">
      <article class="photo-card" tabindex="0">
        <img src="images/strawberry.png" alt="Strawberry chocolate drip cake" loading="lazy" />
        <div class="photo-overlay">
          <span class="photo-title">Strawberries & Cream</span>
          <span class="photo-note">Chocolate ganache drip with fresh strawberries over whipped cream.</span>
          <span class="photo-meta">Homemade</span>
        </div>
      </article>
      <article class="photo-card" tabindex="0">
        <img src="images/pink-drip.jpg" alt="Pink buttercream drip cake" loading="lazy" />
        <div class="photo-overlay">
          <span class="photo-title">Pink Drip</span>
          <span class="photo-note">Pink buttercream with a dark chocolate drip and chocolate shards.</span>
          <span class="photo-meta">Homemade</span>
        </div>
      </article>
      <article class="photo-card" tabindex="0">
        <img src="images/tiramisu.png" alt="Tiramisu cake" loading="lazy" />
        <div class="photo-overlay">
          <span class="photo-title">Tiramisu</span>
          <span class="photo-note">Whipped cream rosettes dusted with cocoa.</span>
          <span class="photo-meta">Homemade</span>
        </div>
      </article>
    </div>
