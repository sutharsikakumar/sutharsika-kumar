<body class="shell-page">
<a class="skip" href="#main-nav">Skip to navigation</a>
<main class="page">
  <section class="wm" id="wm" aria-label="Interactive world-model animation">
    <img class="poster" src="/assets/world-model-fallback.jpg" width="897" height="900" fetchpriority="high"
         alt="A square terrain diorama in a thin box: smooth rendered land near a moving agent, dissolving into noisy particles farther away.">
    <canvas role="img" tabindex="-1" aria-label="3D world in a box: fully rendered within an epsilon neighborhood of a moving agent, diffused into noisy particles beyond it. Drag to orbit."></canvas>
    <svg class="ov" aria-hidden="true"><rect data-agent-box width="12" height="12" fill="none" stroke="#141414" stroke-width="1"/></svg>
    <div class="eq" data-eq>
      x<sub>t</sub> = √ᾱ x<sub>0</sub> + √(1−ᾱ) ε<br>
      √(1−ᾱ) = clamp((‖x − agent‖ − ε) / Δ, 0, 1)
      <label class="eps">ε <input data-eps type="range" min="0.14" max="0.85" step="0.01" value="0.38" aria-label="epsilon, radius of the fully rendered neighborhood"><output data-eps-out>0.38</output></label>
    </div>
  </section>

  <div class="side">
    <h1 class="name">Sutharsika Kumar</h1>
    <div data-social></div>
    <nav class="tabs" id="main-nav" data-nav aria-label="Sections"></nav>
    <noscript><p style="font:14px var(--s-mono)"><a href="/about/">/About</a> <a href="/projects/">/Technical</a> <a href="/writing/">/Writing</a> <a href="/cv/">/Past Lives</a></p></noscript>
  </div>

</main>

<script type="module">
  // The poster is visible immediately; the scene builds in yielding chunks and fades in over it.
  const start = async () => {
    const root = document.getElementById('wm');
    try {
      const { mountWorldModel } = await import('/assets/world-model.js');
      const dispose = await mountWorldModel(root);          // null → WebGL unavailable → poster stays
      if (dispose) addEventListener('pagehide', dispose, { once: true }); else root.classList.add('no-gl');
    } catch (e) { root.classList.add('no-gl'); /* scene failed to build: show the static poster */ }
  };
  start();   // begin building immediately (it yields between chunks); waiting for load + idle left the poster frozen for seconds
</script>
</body>
